name: Build

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 1.8
          distribution: zulu
          cache: maven

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw -Pit -B verify --file pom.xml